[package]
name = "ivre"
version = "0.1.0"
edition = "2021"

[lib]
name = "ivre"
path = "src/lib.rs"

[[bin]]
name = "ivre-argus-parser"
path = "bin/argus.rs"

[[bin]]
name = "ivre-iptables-parser"
path = "bin/iptables.rs"

[[bin]]
name = "ivre-netflow-parser"
path = "bin/netflow.rs"

[[bin]]
name = "ivre-p0f-parser"
path = "bin/p0f.rs"

[[bin]]
name = "ivre-weblog-parser"
path = "bin/weblog.rs"

[[bin]]
name = "ivre-zeek-parser"
path = "bin/zeek.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
sha2 = "0.10"
md5 = "0.7"
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = "0.4"
lazy_static = "1.4"
url = "2.5"
textwrap = "0.16"
